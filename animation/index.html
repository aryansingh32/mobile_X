<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pyramid Recorder</title>
  <style>
    /* Force a completely transparent viewport with no scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #00ff00; 
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Adjusted container so the pyramid fills the recording area */
    .pyramid-loader {
      position: relative;
      width: 512px;  /* High resolution baseline */
      height: 512px;
      display: block;
      transform-style: preserve-3d;
      transform: rotateX(-20deg);
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: spin 4s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotateY(360deg); }
    }

    /* Scaling up your original side size to match the 512px container */
    .pyramid-loader .wrapper .side {
      width: 280px; 
      height: 280px;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: auto;
      transform-origin: center top;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }

    .pyramid-loader .wrapper .side1 {
      transform: rotateZ(-30deg) rotateY(90deg);
      background: conic-gradient(#2BDEAC, #F028FD, #D8CCE6, #2F2585);
    }

    .pyramid-loader .wrapper .side2 {
      transform: rotateZ(30deg) rotateY(90deg);
      background: conic-gradient(#2F2585, #D8CCE6, #F028FD, #2BDEAC);
    }

    .pyramid-loader .wrapper .side3 {
      transform: rotateX(30deg);
      background: conic-gradient(#2F2585, #D8CCE6, #F028FD, #2BDEAC);
    }

    .pyramid-loader .wrapper .side4 {
      transform: rotateX(-30deg);
      background: conic-gradient(#2BDEAC, #F028FD, #D8CCE6, #2F2585);
    }

    /* Scaling up your shadow element */
    .pyramid-loader .wrapper .shadow {
      width: 240px;
      height: 240px;
      background: #8B5AD5;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin: auto;
      transform: rotateX(90deg) translateZ(-160px); /* Adjusted depth */
      filter: blur(24px);
    }
  </style>
</head>
<body>

  <div class="pyramid-loader">
    <div class="wrapper">
      <div class="side side1"></div>
      <div class="side side2"></div>
      <div class="side side3"></div>
      <div class="side side4"></div>
      <div class="shadow"></div>
    </div>
  </div>

</body>
</html>
